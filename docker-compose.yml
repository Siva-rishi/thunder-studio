version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: thunderstudio
      MYSQL_USER: thunderuser
      MYSQL_PASSWORD: thunderpassword
    ports:
      - "3306:3306"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key
      - DATABASE_URL=mysql+pymysql://thunderuser:thunderpassword@db:3306/thunderstudio[cite: 1]
    depends_on:
      - db
